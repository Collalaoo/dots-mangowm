# ---- Shell ----
bind=SUPER,L,spawn,qshell-toggle-search #"Shell: Toggle search"
bind=SUPER,Tab,spawn,qshell-toggle-overview #"Shell: Toggle overview"
bind=SUPER,V,spawn,qshell-toggle-clipboard #"Shell: Toggle clipboard"
bind=SUPER,Period,spawn,qshell-toggle-emoji #"Shell: Toggle emoji"
bind=SUPER,A,spawn,qshell-toggle-sidebar-left #"Shell: Toggle left sidebar"
bind=SUPER,N,spawn,qshell-toggle-sidebar-right #"Shell: Toggle right sidebar"
bind=SUPER,Slash,spawn,qshell-toggle-cheatsheet #"Shell: Toggle cheatsheet"
bind=SUPER,K,spawn,qshell-toggle-osk #"Shell: Toggle on-screen keyboard"
bind=SUPER,M,spawn,qshell-toggle-media #"Shell: Toggle media controls"
bind=SUPER,G,spawn,qshell-toggle-overlay #"Shell: Toggle widget overlay"
bind=CTRL,ALT,Delete,spawn,qshell-toggle-session #"Shell: Toggle session menu"
bind=SUPER,J,spawn,qshell-toggle-bar #"Shell: Toggle bar"

# ---- Wallpaper & Theme ----
bind=CTRL,SUPER,T,spawn,qshell-toggle-wallpaper #"Shell: Change wallpaper"
bind=CTRL,SUPER,ALT,T,spawn,qshell-random-wallpaper #"Shell: Random wallpaper"
bind=CTRL,SUPER,SHIFT,D,spawn,qshell-toggle-dark #"Shell: Toggle light/dark mode"
bind=CTRL,SUPER,R,spawn,killall ydotool qs quickshell; qs -c ii & #"Shell: Restart widgets"

# ---- Utilities: Screenshot, OCR, Color, Clipboard ----
bind=SUPER,SHIFT,S,spawn,qshell-region-screenshot #"Utilities: Screen snip"
bind=SUPER,SHIFT,A,spawn,qshell-region-search #"Utilities: Google Lens"
bind=SUPER,SHIFT,X,spawn,qshell-region-ocr #"Utilities: OCR"
bind=SUPER,SHIFT,T,spawn,qshell-screen-translate #"Utilities: Translate"
bind=SUPER,SHIFT,C,spawn,hyprpicker -a #"Utilities: Pick color"
bind=SUPER,SHIFT,R,spawn,qshell-region-record #"Utilities: Record region"
bind=SUPER,ALT,R,spawn,qshell-region-record
bind=Print,spawn,grim -o \"$(mmsg focused-monitor)\" - | wl-copy #"Utilities: Screenshot"
bind=CTRL,Print,spawn,mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim -o \"$(mmsg focused-monitor)\" $(xdg-user-dir PICTURES)/Screenshots/Screenshot_\"$(date '+%Y-%m-%d_%H.%M.%S')\".png

# ---- Hardware: Brightness & Audio ----
bindl=,XF86MonBrightnessUp,spawn,qshell brightness increment #"Brightness: Up"
bindl=,XF86MonBrightnessDown,spawn,qshell brightness decrement
bind=,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%+
bind=,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%-
bind=,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle
bind=,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle
bind=SUPER,SHIFT,M,spawn,wpctl set-mute @DEFAULT_SINK@ toggle #"Media: Toggle mute"
bind=SUPER,ALT,M,spawn,wpctl set-mute @DEFAULT_SOURCE@ toggle #"Media: Toggle mic"

# ---- Media ----
bind=SUPER,SHIFT,N,spawn,playerctl next #"Media: Next track"
bind=SUPER,SHIFT,B,spawn,playerctl previous #"Media: Previous track"
bind=SUPER,SHIFT,P,spawn,playerctl play-pause #"Media: Play/pause"
bind=,XF86AudioNext,spawn,playerctl next
bind=,XF86AudioPrev,spawn,playerctl previous
bind=,XF86AudioPlay,spawn,playerctl play-pause
bind=,XF86AudioPause,spawn,playerctl play-pause

# ---- Window: Focus ----
bind=SUPER,Left,spawn,mmsg focus l #"Window: Focus left"
bind=SUPER,Right,spawn,mmsg focus r #"Window: Focus right"
bind=SUPER,Up,spawn,mmsg focus u #"Window: Focus up"
bind=SUPER,Down,spawn,mmsg focus d #"Window: Focus down"
bind=SUPER,BracketLeft,spawn,mmsg focus l
bind=SUPER,BracketRight,spawn,mmsg focus r

# ---- Window: Move ----
bind=SUPER,SHIFT,Left,spawn,mmsg swap l #"Window: Move left"
bind=SUPER,SHIFT,Right,spawn,mmsg swap r #"Window: Move right"
bind=SUPER,SHIFT,Up,spawn,mmsg swap u #"Window: Move up"
bind=SUPER,SHIFT,Down,spawn,mmsg swap d #"Window: Move down"
bind=SUPER,SHIFT,Page_Up,spawn,mmsg move-to-prev #"Window: Send to workspace left"
bind=SUPER,SHIFT,Page_Down,spawn,mmsg move-to-next #"Window: Send to workspace right"

# ---- Window: Actions ----
bind=SUPER,Q,spawn,mmsg kill #"Window: Close"
bind=SUPER,ALT,Space,spawn,mmsg toggle float #"Window: Float/Tile"
bind=SUPER,D,spawn,mmsg toggle maximize #"Window: Maximize"
bind=SUPER,F,spawn,mmsg toggle fullscreen #"Window: Fullscreen"
bind=SUPER,P,spawn,mmsg toggle pin #"Window: Pin"
bind=SUPER,Semicolon,spawn,mmsg resize -0.1 #"Window: Shrink split"
bind=SUPER,Apostrophe,spawn,mmsg resize +0.1 #"Window: Grow split"
bind=SUPER,ALT,F,spawn,mmsg toggle fake-fullscreen #"Window: Fullscreen spoof"

# ---- Window: Mouse ----
mousebind=SUPER,mouse:272,spawn,mmsg drag #"Window: Move (mouse)"
mousebind=SUPER,mouse:273,spawn,mmsg resize #"Window: Resize (mouse)"
mousebind=SUPER,mouse:274,spawn,mmsg drag

# ---- Window: Send to workspace ----
bind=SUPER,ALT,1,spawn,mmsg send-to-tag 1
bind=SUPER,ALT,2,spawn,mmsg send-to-tag 2
bind=SUPER,ALT,3,spawn,mmsg send-to-tag 3
bind=SUPER,ALT,4,spawn,mmsg send-to-tag 4
bind=SUPER,ALT,5,spawn,mmsg send-to-tag 5
bind=SUPER,ALT,6,spawn,mmsg send-to-tag 6
bind=SUPER,ALT,7,spawn,mmsg send-to-tag 7
bind=SUPER,ALT,8,spawn,mmsg send-to-tag 8
bind=SUPER,ALT,9,spawn,mmsg send-to-tag 9
bind=SUPER,ALT,0,spawn,mmsg send-to-tag 10
bind=SUPER,ALT,S,spawn,mmsg toggle scratchpad #"Window: Send to scratchpad"

# ---- Workspace: Switch ----
bind=SUPER,1,spawn,mmsg tag 1 #"Workspace: Switch to 1"
bind=SUPER,2,spawn,mmsg tag 2 #"Workspace: Switch to 2"
bind=SUPER,3,spawn,mmsg tag 3 #"Workspace: Switch to 3"
bind=SUPER,4,spawn,mmsg tag 4 #"Workspace: Switch to 4"
bind=SUPER,5,spawn,mmsg tag 5 #"Workspace: Switch to 5"
bind=SUPER,6,spawn,mmsg tag 6 #"Workspace: Switch to 6"
bind=SUPER,7,spawn,mmsg tag 7 #"Workspace: Switch to 7"
bind=SUPER,8,spawn,mmsg tag 8 #"Workspace: Switch to 8"
bind=SUPER,9,spawn,mmsg tag 9 #"Workspace: Switch to 9"
bind=SUPER,0,spawn,mmsg tag 10 #"Workspace: Switch to 10"
bind=SUPER,S,spawn,mmsg toggle scratchpad #"Workspace: Toggle scratchpad"
bind=CTRL,SUPER,Left,spawn,mmsg tag prev #"Workspace: Focus left"
bind=CTRL,SUPER,Right,spawn,mmsg tag next #"Workspace: Focus right"
bind=SUPER,Page_Down,spawn,mmsg tag +1
bind=SUPER,Page_Up,spawn,mmsg tag -1

# ---- Session ----
bind=SUPER,L,spawn,loginctl lock-session #"Session: Lock"
bind=SUPER,SHIFT,L,spawn,systemctl suspend #"Session: Sleep"

# ---- Apps ----
bind=SUPER,Return,spawn,~/.config/hypr/hyprland/scripts/launch_first_available.sh 'foot' 'kitty -1' 'alacritty' 'wezterm' 'konsole' 'kgx' 'uxterm' 'xterm' #"App: Terminal"
bind=SUPER,T,spawn,~/.config/hypr/hyprland/scripts/launch_first_available.sh 'foot' 'kitty -1' 'alacritty' 'wezterm' 'konsole' 'kgx' 'uxterm' 'xterm'
bind=SUPER,E,spawn,~/.config/hypr/hyprland/scripts/launch_first_available.sh 'dolphin' 'nautilus' 'nemo' 'thunar' #"App: File manager"
bind=SUPER,W,spawn,~/.config/hypr/hyprland/scripts/launch_first_available.sh 'google-chrome-stable' 'zen-browser' 'firefox' 'brave' 'chromium' #"App: Browser"
bind=SUPER,C,spawn,~/.config/hypr/hyprland/scripts/launch_first_available.sh 'code' 'codium' 'cursor' 'zed' 'kate' #"App: Code editor"
bind=SUPER,X,spawn,~/.config/hypr/hyprland/scripts/launch_first_available.sh 'kate' 'gnome-text-editor' #"App: Text editor"
bind=SUPER,I,spawn,XDG_CURRENT_DESKTOP=gnome ~/.config/hypr/hyprland/scripts/launch_first_available.sh 'systemsettings' 'gnome-control-center' #"App: Settings"
bind=CTRL,SUPER,V,spawn,~/.config/hypr/hyprland/scripts/launch_first_available.sh 'pavucontrol-qt' 'pavucontrol' #"App: Volume mixer"

# ---- mouse/gesture/scroll binds ----
bind=SUPER,mouse_down,spawn,mmsg tag +1
bind=SUPER,mouse_up,spawn,mmsg tag -1
bind=SUPER,SHIFT,mouse_down,spawn,mmsg move-to-next
bind=SUPER,SHIFT,mouse_up,spawn,mmsg move-to-prev
